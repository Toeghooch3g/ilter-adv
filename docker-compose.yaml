services:
  ilter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8181:8181"
      - "9191:9191"
      - "9192:9192"
    environment:
      - ILTER_STORAGE_PATH=/app/data/ilter.db
    depends_on:
      - redis
    volumes:
      - ilter_data:/app/data

  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Postgres + pgvectorscale backend for the semantic cache.
  # Bring up together with the embedding/rerank profile:
  #   docker compose --profile pg up -d
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ilter
      POSTGRES_PASSWORD: ilter
      POSTGRES_DB: ilter_cache
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/home/postgres/pgdata/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilter -d ilter_cache"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ilter pointed at the Postgres cache backend with an OpenAI embedding model.
  # Opt in explicitly: docker compose --profile pg up -d
  ilter-pg:
    profiles: ["pg"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8181:8181"
      - "9191:9191"
      - "9192:9192"
    environment:
      - ILTER_STORAGE_PATH=/app/data/ilter.db
      - ILTER_CACHE_TYPE=postgres
      - ILTER_CACHE_PG_DSN=postgres://ilter:ilter@postgres:5432/ilter_cache?sslmode=disable
      - ILTER_CACHE_EMBEDDING_MODEL=openai:text-embedding-3-small
      - ILTER_PROVIDER_OPENAI_API_KEY=${ILTER_PROVIDER_OPENAI_API_KEY:-}
    depends_on:
      - postgres
    volumes:
      - ilter_data:/app/data

volumes:
  ilter_data:
  redis_data:
  ollama_data:
  pg_data:
