version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - revive
    - bodyclose
    - exhaustive
    - misspell
    - unparam
    - errorlint
    - gosec
    - gocritic
    - nilerr
    - forcetypeassert
    - wastedassign
    - predeclared
    - contextcheck
    - rowserrcheck
    - sqlclosecheck
    - modernize
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: var-naming
    exhaustive:
      default-signifies-exhaustive: true
    unparam:
      check-exported: false
    gosec:
      excludes:
        - G304
        - G204
  exclusions:
    rules:
      - path: (.+)_test\.go
        text: "G101"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - internal/db/sqlc

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/ilter-ai/ilter
